{% extends "admin.html" %}

{% block content %}
<h2>Ustawienia systemu</h2>

<div class="mb-3">
    <label for="thresholdInput" class="form-label">Threshold weryfikacji twarzy (0-1)</label>
    <input type="number" step="0.01" min="0" max="1" id="thresholdInput" class="form-control" value="{{ settings.threshold }}">
</div>

<div class="mb-3 form-check">
    <input type="checkbox" class="form-check-input" id="cameraEnabled" {% if settings.camera_enabled %}checked{% endif %}>
    <label class="form-check-label" for="cameraEnabled">Włącz kamerę</label>
</div>

<div class="mb-3 form-check">
    <input type="checkbox" class="form-check-input" id="qrEnabled" {% if settings.qr_scanner_enabled %}checked{% endif %}>
    <label class="form-check-label" for="qrEnabled">Włącz skaner QR</label>
</div>

<div class="mb-3">
    <button id="saveSettingsBtn" class="btn btn-primary">Zapisz ustawienia</button>
</div>

<hr>

<h3>Import / Eksport danych</h3>
<div class="mb-3">
    <button id="exportDataBtn" class="btn btn-success">Eksportuj dane</button>
    <input type="file" id="importDataFile" class="form-control mt-2">
    <button id="importDataBtn" class="btn btn-warning mt-2">Importuj dane</button>
</div>

<script>
const saveBtn = document.getElementById("saveSettingsBtn");
saveBtn.addEventListener("click", async () => {
    const threshold = parseFloat(document.getElementById("thresholdInput").value);
    const camera_enabled = document.getElementById("cameraEnabled").checked;
    const qr_scanner_enabled = document.getElementById("qrEnabled").checked;

    const resp = await fetch("/admin/settings", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({threshold, camera_enabled, qr_scanner_enabled})
    });

    const data = await resp.json();
    if(data.status === "ok") alert("Ustawienia zapisane!");
});
</script>
{% endblock %}
