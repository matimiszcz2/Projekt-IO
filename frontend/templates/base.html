<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skaner QR + FaceID</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background: #f0f2f5;
        }

        #qr-reader {
            width: 100%;
            max-width: 500px;
            border: 2px solid #ccc;
            border-radius: 8px;
            background: #000;
        }

        #status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            width: 100%;
            max-width: 470px;
            text-align: center;
            font-weight: bold;
            background: #fff;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .info {
            color: #007bff;
            border-left: 5px solid #007bff;
        }

        .success {
            color: #28a745;
            border-left: 5px solid #28a745;
        }

        .error {
            color: #dc3545;
            border-left: 5px solid #dc3545;
        }

        .processing {
            color: #ffc107;
            border-left: 5px solid #ffc107;
        }
    </style>
     <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</head>

<body>

    <h1>Weryfikacja Pracownika</h1>

    <div id="qr-reader"></div>

    <div id="status" class="info">Zeskanuj kod QR, aby rozpocząć...</div>

    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="{{ url_for('static', filename='js/main.js' )}}"></script>

    <!-- MODAL POTWIERDZENIA -->
<div class="modal fade" id="accessModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Dostęp przyznany</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <p id="modalMessage"></p>
        <p>Czy chcesz przejść do panelu administratora?</p>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" id="reject-btn" data-bs-dismiss="modal">
          Nie
        </button>
        <button type="button" class="btn btn-primary" id="goAdminBtn">
          Tak
        </button>
      </div>

    </div>
  </div>
</div>


</body>

</html>
