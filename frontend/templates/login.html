<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Logowanie</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background-color: #ffffff;
            color: #000000;
            height: 100vh;
        }

        .login-container {
            max-width: 400px;
            margin: auto;
            padding: 2rem;
            margin-top: 8%;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            background-color: #f8f9fa;
        }

        .login-title {
            font-weight: 600;
            color: #0d6efd;
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .btn-primary {
            background-color: #0d6efd;
            border: none;
        }

        .form-control:focus {
            box-shadow: none;
            border-color: #0d6efd;
        }

        .alert {
            display: none;
        }
    </style>
</head>
<body>

<div class="login-container">
    <h2 class="login-title">Panel Logowania</h2>

    <div class="alert alert-danger" id="loginError"></div>

    <form id="loginForm">
        <div class="mb-3">
            <label for="username" class="form-label">Login</label>
            <input type="text" class="form-control" id="username" placeholder="Wpisz login" required>
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">Hasło</label>
            <input type="password" class="form-control" id="password" placeholder="Wpisz hasło" required>
        </div>

        <button type="submit" class="btn btn-primary w-100">Zaloguj</button>
    </form>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const loginForm = document.getElementById("loginForm");
    const loginError = document.getElementById("loginError");

    loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();

        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value.trim();

        if (!username || !password) {
            loginError.innerText = "Uzupełnij wszystkie pola";
            loginError.style.display = "block";
            return;
        }

        try {
            const res = await fetch("/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, password })
            });

            const data = await res.json();

            if (data.status === "ok") {
                // Przekierowanie po zalogowaniu
                window.location.href = "/admin";
            } else {
                loginError.innerText = data.message || "Błąd logowania";
                loginError.style.display = "block";
            }

        } catch (err) {
            loginError.innerText = "Błąd serwera";
            loginError.style.display = "block";
            console.error(err);
        }
    });
</script>
</body>
</html>
