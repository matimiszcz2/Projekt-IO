<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Panel Administratora</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <script src="{{ url_for('static', filename='js/main.js' )}}"></script>

    <style>
        body {
            background-color: #ffffff;
            color: #000000;
        }

        .navbar {
            border-bottom: 1px solid #e5e5e5;
        }

        .navbar-brand {
            font-weight: 600;
            color: #0d6efd !important;
        }

        .nav-link {
            color: #000000 !important;
        }

        .nav-link:hover {
            color: #0d6efd !important;
        }

        .btn-primary {
            background-color: #0d6efd;
            border: none;
        }

        .content {
            padding: 2rem;
        }

        .card {
            border-radius: 12px;
        }
    </style>
</head>
<body>

<!-- 🔹 GÓRNE MENU -->
<nav class="navbar navbar-expand-lg navbar-light bg-white px-3">
    <a class="navbar-brand" href="/admin">AdminPanel</a>

    <!-- Hamburger (mobile) -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#adminNavbar">
        <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Menu -->
    <div class="collapse navbar-collapse" id="adminNavbar">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
                <a class="nav-link" href="/admin/users">Użytkownicy</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/admin/statistics">Raporty</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/admin/settings">Ustawienia</a>
            </li>
        </ul>

        <!-- Przyciski po prawej -->
        <div class="d-flex gap-2">
            <button class="btn btn-primary" id="reject-btn">Wyloguj</button>
        </div>
    </div>
</nav>

<!-- 🔹 CONTENT -->
<div class="container-fluid content">
    <div class="row">
        <div class="col-12">
            <h1 class="mb-4">Panel administratora</h1>

            <div class="row g-4">
                <div class="col-md-4">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <h5 class="card-title">Użytkownicy</h5>
                            <p class="card-text">Zarządzaj kontami użytkowników.</p>
                            <button class="btn btn-primary" onclick="location.href='/admin/users';">Przejdź</button>
                        </div>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <h5 class="card-title">Statystyki</h5>
                            <p class="card-text">Podgląd danych i raportów.</p>
                            <button class="btn btn-primary" onclick="location.href='/admin/statistics';">Przejdź</button>
                        </div>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <h5 class="card-title">Ustawienia</h5>
                            <p class="card-text">Konfiguracja systemu.</p>
                            <button class="btn btn-primary" onclick="location.href='/admin/settings';">Przejdź</button>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
    {% block content %}
    {% endblock %}
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
